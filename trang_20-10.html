<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gửi Hà 🌸 - 20/10</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Quicksand:wght@500;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #ffe6ea 0%, #ffc3a0 100%);
            font-family: 'Quicksand', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        #pantalla-inicial {
            text-align: center;
            cursor: pointer;
            z-index: 10;
            transition: all 0.5s ease;
        }

        .header-text {
            font-size: 2.2rem;
            color: #d63384;
            font-weight: 700;
            margin-bottom: 20px;
            font-family: 'Dancing Script', cursive;
        }

        .gift-box-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            padding: 25px;
            border-radius: 30px;
            border: 2px solid #ffb3c6;
            box-shadow: 0 15px 35px rgba(214, 51, 132, 0.2);
            display: inline-block;
            transition: transform 0.3s ease;
        }

        .gift-box-card:hover {
            transform: scale(1.05);
        }

        .gift-box-card img {
            width: 180px;
            height: 180px;
            object-fit: contain;
            border-radius: 20px;
        }

        .sub-text {
            margin-top: 15px;
            color: #e83e8c;
            font-size: 1rem;
            font-weight: 700;
        }

        #contenido-principal {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100vh;
            position: relative;
            animation: fadeIn 0.8s ease forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        .title-main {
            font-size: 2.3rem;
            color: #d63384;
            font-family: 'Dancing Script', cursive;
            margin-bottom: 10px;
            text-shadow: 0 2px 10px rgba(214, 51, 132, 0.2);
            z-index: 2;
        }

        .flower-image-container {
            position: relative;
            width: 280px;
            height: 280px;
            z-index: 2;
        }

        .flower-image-container img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 15px 25px rgba(214, 51, 132, 0.3));
            animation: floatFlower 3s ease-in-out infinite;
        }

        @keyframes floatFlower {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .letter-modal {
            position: absolute;
            bottom: 35px;
            width: 88%;
            max-width: 380px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(15px);
            border: 2px solid #ffb3c6;
            border-radius: 25px;
            padding: 20px 25px;
            box-shadow: 0 20px 40px rgba(214, 51, 132, 0.25);
            text-align: center;
            z-index: 10;
            opacity: 0;
            transform: translateY(40px);
            transition: all 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .letter-modal.show {
            opacity: 1;
            transform: translateY(0);
        }

        .letter-title {
            font-size: 1.5rem;
            color: #d63384;
            font-family: 'Dancing Script', cursive;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .letter-body {
            font-size: 0.9rem;
            line-height: 1.5;
            color: #495057;
            font-weight: 600;
        }

        .floating-heart {
            position: fixed;
            pointer-events: none;
            font-size: 22px;
            animation: floatUp 4s linear infinite;
            z-index: 1;
        }

        @keyframes floatUp {
            0% { transform: translateY(100vh) scale(0.5); opacity: 1; }
            100% { transform: translateY(-10vh) scale(1.2); opacity: 0; }
        }
    </style>
</head>
<body>

    <div id="pantalla-inicial" onclick="openGift()">
        <h1 class="header-text">Tặng Hà nè 💖</h1>
        <div class="gift-box-card">
            <!-- Thay bằng tên file ảnh sticker trong repo của bro -->
            <img src="sticker.png" alt="Sticker" onerror="this.src='https://cdnjs.cloudflare.com/ajax/libs/twemoji/14.0.2/72x72/1f430.png'">
            <p class="sub-text">Chạm vào đây để mở quà nhé ✨</p>
        </div>
    </div>

    <div id="contenido-principal">
        <h1 class="title-main">Chúc mừng ngày 20/10 💕</h1>

        <div class="flower-image-container">
            <!-- Thay bằng tên file ảnh cả bó hoa tulip trong repo của bro -->
            <img src="bo-hoa.jpg" alt="Bó hoa Tulip" onerror="this.src='https://images.unsplash.com/photo-1520763185298-1b434c919102?auto=format&fit=crop&w=600&q=80'">
        </div>

        <div class="letter-modal" id="letterModal">
            <div class="letter-title">Gửi Hà 🎀</div>
            <div class="letter-body">
                Chúc Hà ngày 20/10 thật nhiều niềm vui, luôn xinh đẹp, rạng rỡ và luôn gặp nhiều may mắn nhé! Cảm ơn Hà vì đã luôn mang lại sự vui vẻ cho mọi người. 💕
            </div>
        </div>
    </div>

    <audio id="bgMusic" loop preload="auto">
        <source src="https://files.catbox.moe/q2y29g.mp3" type="audio/mp3">
    </audio>

    <script>
        function openGift() {
            document.getElementById('pantalla-inicial').style.display = 'none';
            document.getElementById('contenido-principal').style.display = 'flex';

            const music = document.getElementById('bgMusic');
            if (music) music.play().catch(() => {});

            setTimeout(() => {
                document.getElementById('letterModal').classList.add('show');
            }, 800);

            setInterval(createFloatingHeart, 350);
        }

        function createFloatingHeart() {
            const heart = document.createElement('div');
            heart.className = 'floating-heart';
            heart.innerHTML = ['🌸', '💖', '🌷', '✨', '💕'][Math.floor(Math.random() * 5)];
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = (Math.random() * 2 + 3) + 's';
            document.body.appendChild(heart);

            setTimeout(() => { heart.remove(); }, 4000);
        }
    </script>
</body>
</html>
