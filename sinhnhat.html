<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday 3D 🎉</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: radial-gradient(circle at center, #1b1b3a 0%, #090912 100%);
            color: #fff;
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            perspective: 1000px;
        }

        #fireworksCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .scene {
            position: relative;
            z-index: 2;
            width: 90%;
            max-width: 450px;
            transform-style: preserve-3d;
            animation: floatScene 6s ease-in-out infinite;
        }

        @keyframes floatScene {
            0%, 100% { transform: translateY(0) rotateX(2deg) rotateY(-2deg); }
            50% { transform: translateY(-10px) rotateX(-2deg) rotateY(2deg); }
        }

        .card-3d {
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 30px;
            padding: 35px 25px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6), 
                        inset 0 1px 0 rgba(255, 255, 255, 0.2);
            text-align: center;
            transform: translateZ(30px);
        }

        /* Hộp quà 3D */
        .gift-box {
            font-size: 80px;
            cursor: pointer;
            margin-bottom: 15px;
            transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            filter: drop-shadow(0 10px 15px rgba(255, 105, 180, 0.4));
        }
        .gift-box:hover {
            transform: scale(1.15) rotate(10deg);
        }

        h1 {
            font-size: 1.8rem;
            background: linear-gradient(45deg, #ff758c, #ff7eb3);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 15px;
            font-weight: 700;
        }

        .wish-message {
            font-size: 1rem;
            line-height: 1.7;
            color: #e0e0e0;
            background: rgba(0, 0, 0, 0.3);
            padding: 18px;
            border-radius: 16px;
            margin-bottom: 25px;
            border-left: 4px solid #ff758c;
            text-align: left;
            min-height: 100px;
        }

        /* Nút 3D */
        .btn-3d {
            background: linear-gradient(135deg, #ff416c, #ff4b2b);
            color: white;
            border: none;
            padding: 14px 30px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(255, 65, 108, 0.5);
            transition: 0.3s;
            transform: translateZ(20px);
        }
        .btn-3d:hover {
            transform: translateY(-3px) translateZ(30px);
            box-shadow: 0 15px 30px rgba(255, 65, 108, 0.8);
        }

        /* Phần Album ảnh 3D ẩn ban đầu */
        #album-section {
            display: none;
            animation: zoomIn 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        .photo-container {
            width: 100%;
            height: 240px;
            border-radius: 16px;
            overflow: hidden;
            margin-bottom: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            border: 2px solid rgba(255,255,255,0.2);
        }
        .photo-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        @keyframes zoomIn {
            from { opacity: 0; transform: scale(0.7) translateZ(-50px); }
            to { opacity: 1; transform: scale(1) translateZ(0); }
        }
    </style>
</head>
<body>

    <canvas id="fireworksCanvas"></canvas>

    <div class="scene">
        <!-- MÀN HÌNH CHÍNH 3D -->
        <div class="card-3d" id="main-screen">
            <div class="gift-box" onclick="openGift()">🎁</div>
            <h1>Happy Birthday! 🌟</h1>
            
            <div class="wish-message" id="typing-text"></div>

            <button class="btn-3d" onclick="openGift()">Mở Quà Ngay ✨</button>
        </div>

        <!-- MÀN HÌNH KỶ NIỆM SAU KHI MỞ QUÀ -->
        <div class="card-3d" id="album-section">
            <h1>Khoảnh Khắc Tỏa Sáng ✨</h1>
            <div class="photo-container">
                <img src="https://images.unsplash.com/photo-1513151233558-d860c5398176?auto=format&fit=crop&w=600&q=80" alt="Birthday Cake">
            </div>
            <p style="color: #ffb3c6; margin-bottom: 20px; font-weight: 500;">Chúc tuổi mới ngập tràn niềm vui và hạnh phúc nhé! 🎂🎈</p>
            <button class="btn-3d" onclick="location.reload()">Chơi lại từ đầu 🔄</button>
        </div>
    </div>

    <script>
        // Hiệu ứng gõ chữ
        const text = "Chúc cậu tuổi mới thật rực rỡ, luôn giữ được nụ cười tươi trên môi và đạt được mọi dự định đang ấp úng nhé! Mong những điều tuyệt vời nhất sẽ đến với cậu hôm nay và mãi về sau. 🥳🎁";
        let i = 0;
        function typing() {
            if (i < text.length) {
                document.getElementById("typing-text").innerHTML += text.charAt(i);
                i++;
                setTimeout(typing, 40);
            }
        }
        window.onload = typing;

        // Hành động khi mở quà
        function openGift() {
            document.getElementById('main-screen').style.display = 'none';
            document.getElementById('album-section').style.display = 'block';
            
            // Kích hoạt pháo hoa tưng bừng
            triggerFireworks();
        }

        // Đồ họa pháo hoa 3D Canvas
        const canvas = document.getElementById('fireworksCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let particles = [];

        function triggerFireworks() {
            for (let i = 0; i < 120; i++) {
                particles.push({
                    x: canvas.width / 2,
                    y: canvas.height / 2,
                    vx: (Math.random() - 0.5) * 12,
                    vy: (Math.random() - 0.5) * 12,
                    color: `hsl(${Math.random() * 360}, 100%, 60%)`,
                    alpha: 1,
                    size: Math.random() * 5 + 2
                });
            }
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach((p, index) => {
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.15; // trọng lực nhẹ
                p.alpha -= 0.012;

                if (p.alpha <= 0) {
                    particles.splice(index, 1);
                } else {
                    ctx.save();
                    ctx.globalAlpha = p.alpha;
                    ctx.fillStyle = p.color;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                }
            });
            requestAnimationFrame(animate);
        }
        animate();

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
    </script>
</body>
</html>
