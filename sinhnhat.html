<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Hoàng Tráng 🎉</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: radial-gradient(circle at center, #1b1b3a 0%, #090912 100%);
            color: #fff;
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            perspective: 1200px;
        }

        #fireworksCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .scene {
            position: relative;
            z-index: 2;
            width: 90%;
            max-width: 440px;
            transform-style: preserve-3d;
        }

        .card-3d {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 30px;
            padding: 35px 25px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.7);
            text-align: center;
        }

        /* Ẩn màn hình album ban đầu */
        #album-section {
            display: none;
        }

        .gift-box {
            font-size: 80px;
            cursor: pointer;
            margin-bottom: 15px;
            display: inline-block;
            animation: bounceGift 2s infinite ease-in-out;
            filter: drop-shadow(0 10px 15px rgba(255, 105, 180, 0.5));
            transition: 0.3s;
        }
        .gift-box:hover {
            transform: scale(1.15) rotate(10deg);
        }

        @keyframes bounceGift {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        h1 {
            font-size: 1.8rem;
            background: linear-gradient(45deg, #ff758c, #ff7eb3, #ffcc00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 15px;
            font-weight: 700;
        }

        .wish-message {
            font-size: 1rem;
            line-height: 1.7;
            color: #f1f1f1;
            background: rgba(0, 0, 0, 0.35);
            padding: 18px;
            border-radius: 16px;
            margin-bottom: 25px;
            border-left: 4px solid #ff758c;
            text-align: left;
            min-height: 100px;
        }

        .btn-3d {
            background: linear-gradient(135deg, #ff416c, #ff4b2b);
            color: white;
            border: none;
            padding: 14px 30px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(255, 65, 108, 0.6);
            transition: 0.3s;
        }
        .btn-3d:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(255, 65, 108, 0.9);
        }

        .photo-container {
            width: 100%;
            height: 240px;
            border-radius: 16px;
            overflow: hidden;
            margin-bottom: 15px;
            border: 2px solid rgba(255,255,255,0.3);
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .photo-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>
</head>
<body>

    <canvas id="fireworksCanvas"></canvas>

    <div class="scene" id="cardScene">
        <!-- MÀN HÌNH CHÍNH -->
        <div class="card-3d" id="main-screen">
            <div class="gift-box" onclick="openGift()">🎁</div>
            <h1>Happy Birthday! 🌟</h1>
            
            <div class="wish-message" id="typing-text"></div>

            <button class="btn-3d" onclick="openGift()">Mở Quà Ngay ✨</button>
        </div>

        <!-- MÀN HÌNH SAU KHI MỞ QUÀ -->
        <div class="card-3d" id="album-section">
            <h1>Chúc Mừng Sinh Nhật! 🎂</h1>
            <div class="photo-container">
                <img src="https://images.unsplash.com/photo-1530103862676-de8c9debad1d?auto=format&fit=crop&w=600&q=80" alt="Birthday Party">
            </div>
            <p style="color: #ffb3c6; margin-bottom: 20px; font-weight: 500;">Chúc tuổi mới ngập tràn niềm vui, luôn rực rỡ và thành công nhé! 🎈✨</p>
            <button class="btn-3d" onclick="location.reload()">Xem Lại 🔄</button>
        </div>
    </div>

    <!-- Nhạc nền sinh nhật trực tuyến vui tươi hơn -->
    <audio id="bgMusic" loop preload="auto">
        <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-8.mp3" type="audio/mp3">
    </audio>

    <script>
        // Chỉ bật hiệu ứng nghiêng 3D nếu là máy tính (tránh làm lỗi cảm ứng trên điện thoại)
        const scene = document.getElementById('cardScene');
        if (window.innerWidth > 768) {
            document.addEventListener('mousemove', (e) => {
                const xAxis = (window.innerWidth / 2 - e.pageX) / 30;
                const yAxis = (window.innerHeight / 2 - e.pageY) / 30;
                scene.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
            });
        }

        // Gõ chữ lời chúc
        const text = "Chúc cậu tuổi mới thật nhiều niềm vui, luôn xinh đẹp/tỏa sáng, gặp nhiều may mắn và đạt được mọi điều mình muốn nhé! Mong mọi điều tốt đẹp nhất sẽ đến với cậu. 🥳🎁";
        let i = 0;
        function typing() {
            if (i < text.length) {
                document.getElementById("typing-text").innerHTML += text.charAt(i);
                i++;
                setTimeout(typing, 35);
            }
        }
        window.onload = typing;

        // Bật nhạc khi click lần đầu
        document.body.addEventListener('click', () => {
            const music = document.getElementById('bgMusic');
            if (music.paused) music.play();
        }, { once: true });

        // Hàm mở quà chuẩn không bị đen màn hình
        function openGift() {
            document.getElementById('main-screen').style.display = 'none';
            document.getElementById('album-section').style.display = 'block';
            
            // Bắn pháo hoa rợp trời
            triggerFireworks();
        }

        // Đồ họa pháo hoa canvas an toàn
        const canvas = document.getElementById('fireworksCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let particles = [];

        function triggerFireworks() {
            for (let i = 0; i < 90; i++) {
                particles.push({
                    x: canvas.width / 2,
                    y: canvas.height / 2,
                    vx: (Math.random() - 0.5) * 12,
                    vy: (Math.random() - 0.5) * 12,
                    color: `hsl(${Math.random() * 360}, 100%, 60%)`,
                    alpha: 1,
                    size: Math.random() * 4 + 2
                });
            }
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach((p, index) => {
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.1; // trọng lực nhẹ
                p.alpha -= 0.012;

                if (p.alpha <= 0) {
                    particles.splice(index, 1);
                } else {
                    ctx.save();
                    ctx.globalAlpha = p.alpha;
                    ctx.fillStyle = p.color;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                }
            });
            requestAnimationFrame(animate);
        }
        animate();

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
    </script>
</body>
</html>
