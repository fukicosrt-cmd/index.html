<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chúc Mừng Sinh Nhật 🎉</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
            text-align: center;
        }

        /* Canvas pháo hoa */
        #fireworksCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .container {
            position: relative;
            z-index: 2;
            width: 90%;
            max-width: 420px;
            padding: 20px;
        }

        /* Thẻ chính */
        .card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 24px;
            padding: 30px 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            animation: fadeIn 1s ease-in-out;
        }

        /* Bánh kem & Ngọn nến */
        .cake-box {
            font-size: 70px;
            margin-bottom: 15px;
            position: relative;
            animation: bounce 2s infinite ease-in-out;
        }

        .candle {
            font-size: 30px;
            position: absolute;
            top: -25px;
            left: 50%;
            transform: translateX(-50%);
            transition: 0.5s;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        h2 {
            color: #ffcc00;
            font-size: 1.7rem;
            margin-bottom: 15px;
            text-shadow: 0 0 15px rgba(255, 204, 0, 0.5);
        }

        .message-box {
            font-size: 1.05rem;
            line-height: 1.6;
            color: #f1f1f1;
            min-height: 90px;
            margin-bottom: 25px;
            text-align: left;
            background: rgba(0, 0, 0, 0.25);
            padding: 15px;
            border-radius: 14px;
        }

        /* Nút bấm */
        .btn-group {
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        button {
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: 600;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-wish {
            background: linear-gradient(45deg, #ff416c, #ff4b2b);
            color: white;
            box-shadow: 0 5px 20px rgba(255, 65, 108, 0.5);
        }
        .btn-wish:hover {
            transform: scale(1.08);
            box-shadow: 0 8px 25px rgba(255, 65, 108, 0.8);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <canvas id="fireworksCanvas"></canvas>

    <div class="container">
        <div class="card">
            <!-- Bánh kem và ngọn nến -->
            <div class="cake-box">
                <span id="candle" class="candle">🕯️🔥</span>
                🎂
            </div>

            <h2>Chúc Mừng Sinh Nhật! 🥳</h2>
            
            <div class="message-box" id="typing-text"></div>

            <div class="btn-group">
                <button class="btn-wish" onclick="blowCandle()">Thổi nến & Nhận quà 🎁</button>
            </div>
        </div>
    </div>

    <!-- Nhạc nền sinh nhật -->
    <audio id="bgMusic" loop preload="auto">
        <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mp3">
    </audio>

    <script>
        // Lời chúc sinh nhật
        const message = "Chúc cậu tuổi mới luôn vui vẻ, vạn sự như ý, luôn xinh đẹp và gặp thật nhiều may mắn trong cuộc sống nhé! Mong mọi điều tốt đẹp nhất sẽ đến với cậu. Happy Birthday! 🎂✨";
        let index = 0;

        function typeWriter() {
            if (index < message.length) {
                document.getElementById("typing-text").innerHTML += message.charAt(index);
                index++;
                setTimeout(typeWriter, 45);
            }
        }

        // Tự động bật nhạc khi click lần đầu
        document.body.addEventListener('click', () => {
            const music = document.getElementById('bgMusic');
            if (music.paused) music.play();
        }, { once: true });

        window.onload = typeWriter;

        // Khi bấm nút thổi nến
        function blowCandle() {
            // Tắt lửa nến
            document.getElementById('candle').innerText = '🕯️';
            
            // Đổi nội dung thông báo
            alert("Chúc mừng sinh nhật cậu! Chúc điều ước hôm nay của cậu sẽ thành hiện thực nhé! 🌟");

            // Bắn pháo hoa rợp trời
            launchFireworks();
        }

        // Hiệu ứng pháo hoa bùng nổ
        const canvas = document.getElementById('fireworksCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let particles = [];

        function launchFireworks() {
            for (let i = 0; i < 80; i++) {
                particles.push({
                    x: canvas.width / 2,
                    y: canvas.height / 2,
                    vx: (Math.random() - 0.5) * 10,
                    vy: (Math.random() - 0.5) * 10,
                    color: `hsl(${Math.random() * 360}, 100%, 60%)`,
                    alpha: 1
                });
            }
        }

        function loop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach((p, index) => {
                p.x += p.vx;
                p.y += p.vy;
                p.alpha -= 0.01;
                if (p.alpha <= 0) {
                    particles.splice(index, 1);
                } else {
                    ctx.fillStyle = p.color;
                    ctx.globalAlpha = p.alpha;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
                    ctx.fill();
                }
            });
            requestAnimationFrame(loop);
        }
        loop();
    </script>
</body>
</html>
