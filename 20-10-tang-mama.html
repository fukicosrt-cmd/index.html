<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mừng Ngày 20/10 - Gửi Mẹ Yêu Dấu ❤️</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: radial-gradient(circle at center, #4a1525 0%, #15050a 100%);
            color: #ffffff;
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            padding: 15px;
        }

        #fireworksCanvas, #heartsCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .scene {
            position: relative;
            z-index: 2;
            width: 90%;
            max-width: 440px;
        }

        .card-3d {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 183, 178, 0.3);
            border-radius: 30px;
            padding: 30px 22px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.9);
            text-align: center;
        }

        h1 {
            font-size: 1.6rem;
            background: linear-gradient(45deg, #ff9a9e, #ff6a88, #ff99ac);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 12px;
            font-weight: 700;
        }

        .photo-container {
            width: 100%;
            height: 210px;
            border-radius: 18px;
            overflow: hidden;
            margin-bottom: 18px;
            border: 2px solid rgba(255, 183, 178, 0.4);
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .photo-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .wish-message {
            font-size: 0.92rem;
            line-height: 1.7;
            color: #fff0f3;
            background: rgba(0, 0, 0, 0.45);
            padding: 16px;
            border-radius: 16px;
            margin-bottom: 20px;
            border-left: 4px solid #ff758c;
            text-align: left;
            min-height: 130px;
            max-height: 170px;
            overflow-y: auto;
        }
        .wish-message::-webkit-scrollbar {
            width: 4px;
        }
        .wish-message::-webkit-scrollbar-thumb {
            background: rgba(255, 117, 140, 0.6);
            border-radius: 10px;
        }

        .btn-love {
            background: linear-gradient(135deg, #ff758c, #ff7eb3);
            color: white;
            border: none;
            padding: 13px 30px;
            font-size: 0.95rem;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(255, 117, 140, 0.6);
            transition: 0.3s;
        }
        .btn-love:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(255, 117, 140, 0.9);
        }

        #welcome-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(21, 5, 10, 0.97);
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }
    </style>
</head>
<body>

    <canvas id="heartsCanvas"></canvas>
    <canvas id="fireworksCanvas"></canvas>

    <!-- MÀN HÌNH CHÀO MỞ QUÀ DÀNH RIÊNG CHO MẸ -->
    <div id="welcome-overlay">
        <div style="font-size: 80px; margin-bottom: 15px; animation: bounce 2s infinite;">❤️</div>
        <h1 style="color: #ff9a9e; font-size: 1.7rem; margin-bottom: 10px;">Món Quà Đặc Biệt Dành Tặng Mẹ</h1>
        <p style="color: #ffb3c6; margin-bottom: 25px; font-size: 0.95rem;">Món quà từ tấm lòng của con, mời mẹ nhấn để mở nhé!</p>
        <button class="btn-love" onclick="startExperience()">Mở Quà Của Con ✨</button>
    </div>

    <div class="scene">
        <div class="card-3d">
            <h1>Chúc Mừng 20/10 Mẹ Yêu! 💐</h1>
            <div class="photo-container">
                <img src="https://images.unsplash.com/photo-1544717305-2782549b5136?auto=format&fit=crop&w=600&q=80" alt="Mẹ yêu">
            </div>
            
            <div class="wish-message" id="typing-text"></div>

            <button class="btn-love" onclick="location.reload()">Xem Lại Từ Đầu 🔄</button>
        </div>
    </div>

    <!-- Nhạc nền nhẹ nhàng -->
    <audio id="bgMusic" loop preload="auto">
        <source src="https://files.catbox.moe/q2y29g.mp3" type="audio/mp3">
    </audio>

    <script>
        function startExperience() {
            const overlay = document.getElementById('welcome-overlay');
            overlay.style.opacity = '0';
            setTimeout(() => overlay.style.display = 'none', 600);

            const music = document.getElementById('bgMusic');
            if (music) music.play().catch(() => {});

            startTyping();
            triggerFireworks();
        }

        // Lời chúc chân thành, sâu sắc gửi mẹ
        const text = "Gửi mẹ yêu dấu của con!\n\nNhân ngày 20/10, con muốn gửi lời tri ân sâu sắc nhất đến mẹ – người phụ nữ tuyệt vời nhất cuộc đời con. Con xin lỗi vì đôi lúc làm mẹ phải phiền lòng và lo lắng.\n\nCảm ơn mẹ vì luôn là điểm tựa vững chắc, luôn hy sinh thầm lặng và dành cho con những điều kiện tốt đẹp nhất. Con chỉ cầu mong mẹ luôn dồi dào sức khỏe, luôn mỉm cười và bình an mỗi ngày. Con tự hào vì được làm con của mẹ! ❤️";
        
        function startTyping() {
            let i = 0;
            const target = document.getElementById("typing-text");
            function typeStep() {
                if (i < text.length && target) {
                    if (text.charAt(i) === '\n') {
                        target.innerHTML += '<br>';
                    } else {
                        target.innerHTML += text.charAt(i);
                    }
                    i++;
                    target.scrollTop = target.scrollHeight;
                    setTimeout(typeStep, 38);
                }
            }
            typeStep();
        }

        // Trái tim bay lả tả nền
        const hCanvas = document.getElementById('heartsCanvas');
        const hCtx = hCanvas.getContext('2d');
        hCanvas.width = window.innerWidth;
        hCanvas.height = window.innerHeight;

        let hearts = [];
        for (let i = 0; i < 35; i++) {
            hearts.push({
                x: Math.random() * hCanvas.width,
                y: Math.random() * hCanvas.height,
                size: Math.random() * 6 + 3,
                speedY: Math.random() * 1.2 + 0.5,
                opacity: Math.random() * 0.6 + 0.3
            });
        }

        function animateHearts() {
            hCtx.clearRect(0, 0, hCanvas.width, hCanvas.height);
            hCtx.fillStyle = "rgba(255, 117, 140, 0.7)";
            
            hearts.forEach(h => {
                h.y -= h.speedY;
                if (h.y < 0) h.y = hCanvas.height;
                
                hCtx.globalAlpha = h.opacity;
                hCtx.beginPath();
                hCtx.arc(h.x, h.y, h.size, 0, Math.PI * 2);
                hCtx.fill();
            });
            requestAnimationFrame(animateHearts);
        }
        animateHearts();

        // Pháo hoa rực rỡ khi mở quà
        const fCanvas = document.getElementById('fireworksCanvas');
        const fCtx = fCanvas ? fCanvas.getContext('2d') : null;
        if (fCanvas) {
            fCanvas.width = window.innerWidth;
            fCanvas.height = window.innerHeight;
        }

        let particles = [];
        function triggerFireworks() {
            if (!fCanvas) return;
            for (let i = 0; i < 100; i++) {
                particles.post({} = {}); // safety check
                particles.push({
                    x: fCanvas.width / 2,
                    y: fCanvas.height / 2,
                    vx: (Math.random() - 0.5) * 14,
                    vy: (Math.random() - 0.5) * 14,
                    color: `hsl(${Math.random() * 40 + 330}, 100%, 75%)`,
                    alpha: 1,
                    size: Math.random() * 5 + 2
                });
            }
        }

        function animateFireworks() {
            if (fCtx && fCanvas) {
                fCtx.clearRect(0, 0, fCanvas.width, fCanvas.height);
                particles.forEach((p, index) => {
                    p.x += p.vx;
                    p.y += p.vy;
                    p.vy += 0.08;
                    p.alpha -= 0.012;

                    if (p.alpha <= 0) {
                        particles.splice(index, 1);
                    } else {
                        fCtx.save();
                        fCtx.globalAlpha = p.alpha;
                        fCtx.fillStyle = p.color;
                        fCtx.beginPath();
                        fCtx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                        fCtx.fill();
                        fCtx.restore();
                    }
                });
            }
            requestAnimationFrame(animateFireworks);
        }
        animateFireworks();

        window.addEventListener('resize', () => {
            if (hCanvas && fCanvas) {
                hCanvas.width = window.innerWidth;
                hCanvas.height = window.innerHeight;
                fCanvas.width = window.innerWidth;
                fCanvas.height = window.innerHeight;
            }
        });
    </script>
</body>
</html>
