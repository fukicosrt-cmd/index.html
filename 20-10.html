<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Món Quà Đặc Biệt 20/10 🌸✨</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: radial-gradient(circle at center, #2b1636 0%, #0d0612 100%);
            color: #fff;
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        #petalsCanvas, #fireworksCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .scene {
            position: relative;
            z-index: 2;
            width: 90%;
            max-width: 440px;
        }

        .card-3d {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 30px;
            padding: 35px 25px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8);
            text-align: center;
            transition: all 0.5s ease;
        }

        .hidden {
            display: none !important;
        }

        h1 {
            font-size: 1.5rem;
            background: linear-gradient(45deg, #ff9a9e, #fad0c4, #ffecd2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 15px;
            font-weight: 700;
        }

        p {
            color: #ffb3c6;
            font-size: 0.95rem;
            margin-bottom: 20px;
            line-height: 1.6;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: center;
            margin-top: 20px;
            position: relative;
            min-height: 110px;
        }

        .btn-love {
            background: linear-gradient(135deg, #ff758c, #ff7eb3);
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 0.95rem;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(255, 117, 140, 0.5);
            transition: 0.3s;
            z-index: 5;
        }
        .btn-love:hover {
            transform: scale(1.08);
            box-shadow: 0 15px 25px rgba(255, 117, 140, 0.8);
        }

        /* Nút từ chối được tách hẳn xuống dưới, dùng fixed để né chuột bay khắp màn hình mà không đè nút chính */
        .btn-run {
            background: rgba(255, 255, 255, 0.15);
            color: #ddd;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 10px 20px;
            font-size: 0.85rem;
            font-weight: 500;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.15s ease-out;
            z-index: 4;
        }

        .quiz-option {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 12px 20px;
            border-radius: 16px;
            margin: 8px 0;
            width: 100%;
            cursor: pointer;
            font-size: 0.95rem;
            transition: 0.3s;
        }
        .quiz-option:hover {
            background: rgba(255, 117, 140, 0.3);
            border-color: #ff758c;
        }

        .wish-message {
            font-size: 0.95rem;
            line-height: 1.7;
            color: #f1f1f1;
            background: rgba(0, 0, 0, 0.4);
            padding: 16px;
            border-radius: 16px;
            margin-bottom: 20px;
            border-left: 4px solid #ff758c;
            text-align: left;
            min-height: 100px;
        }

        .photo-container {
            width: 100%;
            height: 200px;
            border-radius: 16px;
            overflow: hidden;
            margin-bottom: 15px;
            border: 2px solid rgba(255,255,255,0.25);
        }
        .photo-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>
</head>
<body>

    <canvas id="petalsCanvas"></canvas>
    <canvas id="fireworksCanvas"></canvas>

    <div class="scene">
        <!-- BƯỚC 1: MINI QUIZ -->
        <div class="card-3d" id="step-quiz">
            <h1>Khảo Sát Nhỏ Trước Đã! </h1>
            <p>Hôm nay là ngày đặc biệt gì mà xinh đẹp rạng rỡ thế nhỉ?</p>
            <button class="quiz-option" onclick="nextStep(2)">A. Ngày 20/10 (Quà đâu mang ra mau! 🎁)</button>
            <button class="quiz-option" onclick="nextStep(2)">B. Ngày bình thường nhưng thích đòi quà ✨</button>
            <button class="quiz-option" onclick="nextStep(2)">C. Ngày em đẹp nhất hệ mặt trời 🌸</button>
        </div>

        <!-- BƯỚC 2: HỘP QUÀ + NÚT NÉ HOÀN TOÀN TÁCH BIỆT -->
        <div class="card-3d hidden" id="step-gift">
            <div style="font-size: 70px; margin-bottom: 10px; animation: bounce 2s infinite;">🎁</div>
            <h1>Có Món Quà Nhỏ Cho Cậu... ✨</h1>
            <p>Một chiếc hộp bất ngờ đang chờ được mở. Cậu có đồng ý nhận không nào?</p>
            
            <div class="btn-group" id="btnGroup">
                <button class="btn-love" onclick="nextStep(3)">Nhận Ngay ❤️</button>
                <button class="btn-run" id="btnRun" onmouseover="moveButton()" onclick="moveButton()">Không Thèm! 🤪</button>
            </div>
        </div>

        <!-- BƯỚC 3: THIỆP MỞ RA + CHỮ CHẠY -->
        <div class="card-3d hidden" id="step-card">
            <h1>Chúc Mừng 20/10! </h1>
            <div class="photo-container">
                <img src="https://images.unsplash.com/photo-1526047932273-341f2a7631f9?auto=format&fit=crop&w=600&q=80" alt="Gift">
            </div>
            
            <div class="wish-message" id="typing-text"></div>

            <button class="btn-love" onclick="location.reload()">Xem Lại Từ Đầu 🔄</button>
        </div>
    </div>

    <!-- Nhạc Lofi "Tập Cho Mình Thói Quen" -->
    <audio id="bgMusic" loop preload="auto">
        <source src="https://files.catbox.moe/q2y29g.mp3" type="audio/mp3">
    </audio>

    <script>
        function nextStep(stepNum) {
            const music = document.getElementById('bgMusic');
            if (music) music.play().catch(() => {});

            document.getElementById('step-quiz').classList.add('hidden');
            document.getElementById('step-gift').classList.add('hidden');
            document.getElementById('step-card').classList.add('hidden');

            if (stepNum === 2) {
                document.getElementById('step-gift').classList.remove('hidden');
            } else if (stepNum === 3) {
                document.getElementById('step-card').classList.remove('hidden');
                startTyping();
                triggerFireworks();
            }
        }

        // Nút "Không thèm" nhảy né tự do ra xung quanh card mà không bao giờ đè nút chính
        let runCount = 0;
        const refusalTexts = ["Không Thèm! 🤪", "Bắt hụt nhé 😛", "Thử bấm nữa xem 😆", "Hổng cho bấm đâu 🙈", "Chọn nút kia đi mà ❤️"];
        
        function moveButton() {
            const btn = document.getElementById('btnRun');
            runCount++;
            btn.innerText = refusalTexts[runCount % refusalTexts.length];
            
            // Dùng vị trí ngẫu nhiên rộng hơn bên trong khung card
            const randomX = (Math.random() - 0.5) * 220;
            const randomY = (Math.random() - 0.5) * 120 + 30;
            btn.style.transform = `translate(${randomX}px, ${randomY}px)`;
        }

        const text = "Chúc cậu một ngày 20/10 ngập tràn niềm vui, luôn xinh tươi, rạng rỡ và lúc nào cũng cười tươi thế này nhé! Mong mọi điều tốt đẹp nhất sẽ luôn đồng hành cùng cậu. 🌷✨";
        function startTyping() {
            let i = 0;
            const target = document.getElementById("typing-text");
            target.innerHTML = "";
            function typeStep() {
                if (i < text.length && target) {
                    target.innerHTML += text.charAt(i);
                    i++;
                    setTimeout(typeStep, 35);
                }
            }
            typeStep();
        }

        // Cánh hoa bay nền
        const petalsCanvas = document.getElementById('petalsCanvas');
        const pCtx = petalsCanvas.getContext('2d');
        petalsCanvas.width = window.innerWidth;
        petalsCanvas.height = window.innerHeight;

        let petals = [];
        for (let i = 0; i < 35; i++) {
            petals.push({
                x: Math.random() * petalsCanvas.width,
                y: Math.random() * petalsCanvas.height,
                r: Math.random() * 6 + 4,
                d: Math.random() * 35
            });
        }

        function drawPetals() {
            pCtx.clearRect(0, 0, petalsCanvas.width, petalsCanvas.height);
            pCtx.fillStyle = "rgba(255, 182, 193, 0.6)";
            pCtx.beginPath();
            petals.forEach(p => {
                pCtx.moveTo(p.x, p.y);
                pCtx.arc(p.x, p.y, p.r, 0, Math.PI * 2, true);
            });
            pCtx.fill();
            updatePetals();
        }

        let angle = 0;
        function updatePetals() {
            angle += 0.01;
            petals.forEach(p => {
                p.y += Math.cos(angle + p.d) + 1 + p.r / 3;
                p.x += Math.sin(angle) * 1.5;
                if (p.x > petalsCanvas.width + 10 || p.x < -10 || p.y > petalsCanvas.height) {
                    p.x = Math.random() * petalsCanvas.width;
                    p.y = -10;
                }
            });
        }
        setInterval(drawPetals, 25);

        // Pháo hoa
        const canvas = document.getElementById('fireworksCanvas');
        const ctx = canvas ? canvas.getContext('2d') : null;
        if (canvas) {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        let particles = [];
        function triggerFireworks() {
            if (!canvas) return;
            for (let i = 0; i < 90; i++) {
                particles.push({
                    x: canvas.width / 2,
                    y: canvas.height / 2,
                    vx: (Math.random() - 0.5) * 12,
                    vy: (Math.random() - 0.5) * 12,
                    color: `hsl(${Math.random() * 40 + 330}, 100%, 75%)`,
                    alpha: 1,
                    size: Math.random() * 5 + 2
                });
            }
        }

        function animateFireworks() {
            if (ctx && canvas) {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                particles.forEach((p, index) => {
                    p.x += p.vx;
                    p.y += p.vy;
                    p.vy += 0.08;
                    p.alpha -= 0.012;

                    if (p.alpha <= 0) {
                        particles.splice(index, 1);
                    } else {
                        ctx.save();
                        ctx.globalAlpha = p.alpha;
                        ctx.fillStyle = p.color;
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.restore();
                    }
                });
            }
            requestAnimationFrame(animateFireworks);
        }
        animateFireworks();

        window.addEventListener('resize', () => {
            if (canvas && petalsCanvas) {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
                petalsCanvas.width = window.innerWidth;
                petalsCanvas.height = window.innerHeight;
            }
        });
    </script>
</body>
</html>
