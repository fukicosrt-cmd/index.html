<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chúc Mừng 20/10 Vui Vẻ Nhé! 🌸✨</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: radial-gradient(circle at center, #361f38 0%, #100814 100%);
            color: #fff;
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        #petalsCanvas, #fireworksCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .scene {
            position: relative;
            z-index: 2;
            width: 90%;
            max-width: 440px;
        }

        .card-3d {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 30px;
            padding: 35px 25px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.7);
            text-align: center;
        }

        #gift-section {
            display: none;
            animation: fadeIn 0.8s ease forwards;
        }

        .gift-box {
            font-size: 80px;
            cursor: pointer;
            margin-bottom: 15px;
            display: inline-block;
            animation: bounceGift 2s infinite ease-in-out;
            filter: drop-shadow(0 12px 20px rgba(255, 117, 140, 0.6));
            transition: 0.3s;
        }
        .gift-box:hover {
            transform: scale(1.15) rotate(10deg);
        }

        @keyframes bounceGift {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-12px); }
        }

        h1 {
            font-size: 1.6rem;
            background: linear-gradient(45deg, #ff9a9e, #fad0c4, #ffecd2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 15px;
            font-weight: 700;
        }

        .wish-message {
            font-size: 0.98rem;
            line-height: 1.7;
            color: #f1f1f1;
            background: rgba(0, 0, 0, 0.35);
            padding: 18px;
            border-radius: 16px;
            margin-bottom: 22px;
            border-left: 4px solid #ff758c;
            text-align: left;
            min-height: 110px;
        }

        .btn-love {
            background: linear-gradient(135deg, #ff758c, #ff7eb3);
            color: white;
            border: none;
            padding: 14px 30px;
            font-size: 0.98rem;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(255, 117, 140, 0.6);
            animation: pulseBtn 2s infinite;
            transition: 0.3s;
        }
        .btn-love:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(255, 117, 140, 0.9);
        }

        @keyframes pulseBtn {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        .photo-container {
            width: 100%;
            height: 220px;
            border-radius: 18px;
            overflow: hidden;
            margin-bottom: 18px;
            border: 2px solid rgba(255,255,255,0.25);
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
        }
        .photo-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>

    <canvas id="petalsCanvas"></canvas>
    <canvas id="fireworksCanvas"></canvas>

    <div class="scene">
        <!-- MÀN HÌNH CHƯA MỞ QUÀ -->
        <div class="card-3d" id="main-screen">
            <div class="gift-box" onclick="openGift()">🎁</div>
            <h1>Có Món Quà 20/10 Cho Cậu... 🌸</h1>
            <p style="font-size: 0.9rem; color: #ffb3c6; margin-bottom: 22px;">Nhấn vào hộp quà để xem điều bất ngờ nhé!</p>
            <button class="btn-love" onclick="openGift()">Mở Quà Ngay ✨</button>
        </div>

        <!-- MÀN HÌNH SAU KHI MỞ QUÀ -->
        <div class="card-3d" id="gift-section">
            <h1>Chúc Mừng 20/10! 💐</h1>
            <div class="photo-container">
                <img src="https://images.unsplash.com/photo-1526047932273-341f2a7631f9?auto=format&fit=crop&w=600&q=80" alt="Flowers 20/10">
            </div>
            
            <div class="wish-message" id="typing-text"></div>

            <button class="btn-love" onclick="location.reload()">Xem Lại 🔄</button>
        </div>
    </div>

    <!-- Nhạc Lofi "Tập Cho Mình Thói Quen" -->
    <audio id="bgMusic" loop preload="auto">
        <source src="https://files.catbox.moe/q2y29g.mp3" type="audio/mp3">
    </audio>

    <script>
        // Hiệu ứng cánh hoa bay lất phất nền
        const petalsCanvas = document.getElementById('petalsCanvas');
        const pCtx = petalsCanvas.getContext('2d');
        petalsCanvas.width = window.innerWidth;
        petalsCanvas.height = window.innerHeight;

        let petals = [];
        for (let i = 0; i < 35; i++) {
            petals.push({
                x: Math.random() * petalsCanvas.width,
                y: Math.random() * petalsCanvas.height,
                r: Math.random() * 6 + 4,
                d: Math.random() * 35,
                color: `rgba(255, ${Math.floor(Math.random() * 100 + 150)}, 200, 0.7)`
            });
        }

        function drawPetals() {
            pCtx.clearRect(0, 0, petalsCanvas.width, petalsCanvas.height);
            pCtx.fillStyle = "rgba(255, 182, 193, 0.6)";
            pCtx.beginPath();
            petals.forEach(p => {
                pCtx.moveTo(p.x, p.y);
                pCtx.arc(p.x, p.y, p.r, 0, Math.PI * 2, true);
            });
            pCtx.fill();
            updatePetals();
        }

        let angle = 0;
        function updatePetals() {
            angle += 0.01;
            petals.forEach(p => {
                p.y += Math.cos(angle + p.d) + 1 + p.r / 3;
                p.x += Math.sin(angle) * 1.5;
                if (p.x > petalsCanvas.width + 10 || p.x < -10 || p.y > petalsCanvas.height) {
                    p.x = Math.random() * petalsCanvas.width;
                    p.y = -10;
                }
            });
        }
        setInterval(drawPetals, 25);

        // Hiệu ứng gõ chữ lời chúc
        const text = "Chúc cậu có một ngày 20/10 ngập tràn niềm vui, luôn xinh đẹp, rạng rỡ và đạt được mọi điều mình mong muốn nhé! Mong những gì tuyệt vời nhất sẽ luôn đồng hành cùng cậu. 🌷✨";
        
        function typing() {
            let i = 0;
            const target = document.getElementById("typing-text");
            function typeStep() {
                if (i < text.length && target) {
                    target.innerHTML += text.charAt(i);
                    i++;
                    setTimeout(typeStep, 35);
                }
            }
            typeStep();
        }

        // Mở quà
        function openGift() {
            const music = document.getElementById('bgMusic');
            if (music) {
                music.play().catch(() => {});
            }

            document.getElementById('main-screen').style.display = 'none';
            document.getElementById('gift-section').style.display = 'block';
            
            typing();
            triggerFireworks();
        }

        // Pháo hoa khi mở quà
        const canvas = document.getElementById('fireworksCanvas');
        const ctx = canvas ? canvas.getContext('2d') : null;
        if (canvas) {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        let particles = [];

        function triggerFireworks() {
            if (!canvas) return;
            for (let i = 0; i < 90; i++) {
                particles.push({
                    x: canvas.width / 2,
                    y: canvas.height / 2,
                    vx: (Math.random() - 0.5) * 12,
                    vy: (Math.random() - 0.5) * 12,
                    color: `hsl(${Math.random() * 40 + 330}, 100%, 75%)`,
                    alpha: 1,
                    size: Math.random() * 5 + 2
                });
            }
        }

        function animateFireworks() {
            if (ctx && canvas) {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                particles.forEach((p, index) => {
                    p.x += p.vx;
                    p.y += p.vy;
                    p.vy += 0.08;
                    p.alpha -= 0.012;

                    if (p.alpha <= 0) {
                        particles.splice(index, 1);
                    } else {
                        ctx.save();
                        ctx.globalAlpha = p.alpha;
                        ctx.fillStyle = p.color;
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.restore();
                    }
                });
            }
            requestAnimationFrame(animateFireworks);
        }
        animateFireworks();

        window.addEventListener('resize', () => {
            if (canvas && petalsCanvas) {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
                petalsCanvas.width = window.innerWidth;
                petalsCanvas.height = window.innerHeight;
            }
        });
    </script>
</body>
</html>
