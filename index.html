<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For You ❤️</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0d0d1a;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            text-align: center;
            padding: 20px;
        }

        /* Hiệu ứng Trái tim đập */
        .heart-container {
            position: relative;
            width: 100px;
            height: 100px;
            margin-bottom: 30px;
            cursor: pointer;
        }

        .heart {
            position: absolute;
            width: 100px;
            height: 100px;
            background-color: #ff4d6d;
            transform: rotate(-45deg);
            animation: beat 1.2s infinite;
            box-shadow: 0 0 40px #ff4d6d;
        }

        .heart::before,
        .heart::after {
            content: '';
            position: absolute;
            width: 100px;
            height: 100px;
            background-color: #ff4d6d;
            border-radius: 50%;
        }

        .heart::before {
            top: -50px;
            left: 0;
        }

        .heart::after {
            left: 50px;
            top: 0;
        }

        @keyframes beat {
            0% { transform: rotate(-45deg) scale(0.8); }
            50% { transform: rotate(-45deg) scale(1.1); }
            100% { transform: rotate(-45deg) scale(0.8); }
        }

        /* Lời nhắn gõ chữ */
        .message-box {
            max-width: 500px;
            min-height: 120px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
        }

        #text {
            font-size: 1.2rem;
            line-height: 1.6;
            color: #ffe6ea;
            text-shadow: 0 0 10px rgba(255, 77, 109, 0.5);
        }

        /* Mưa trái tim rơi */
        .falling-heart {
            position: fixed;
            top: -10vh;
            font-size: 20px;
            user-select: none;
            pointer-events: none;
            animation: fall linear forwards;
        }

        @keyframes fall {
            to {
                transform: translateY(105vh) rotate(360deg);
            }
        }
    </style>
</head>
<body>

    <div class="heart-container" onclick="createBurst()">
        <div class="heart"></div>
    </div>

    <div class="message-box">
        <p id="text"></p>
    </div>

    <script>
        // Bro muốn đổi lời chúc thì sửa chữ trong ngoặc kép ở dưới nhé:
const message = "Chào buổi sáng. Chúc em một ngày thật nhiều niềm vui và luôn xinh đẹp tươi tắn nhé❤️. Mong là nụ cười của em hôm nay sẽ làm cả ngày tươi sáng hơn! ✨💖";
        
        let index = 0;
        const textElement = document.getElementById("text");

        // Hiệu ứng gõ chữ tự động
        function typeWriter() {
            if (index < message.length) {
                textElement.innerHTML += message.charAt(index);
                index++;
                setTimeout(typeWriter, 50); // Tốc độ gõ chữ (ms)
            }
        }

        // Tạo hiệu ứng mưa trái tim rơi
        function createHeart() {
            const heart = document.createElement("div");
            heart.classList.add("falling-heart");
            heart.innerHTML = "💖";
            heart.style.left = Math.random() * 100 + "vw";
            heart.style.animationDuration = Math.random() * 3 + 2 + "s";
            heart.style.opacity = Math.random();
            heart.style.fontSize = Math.random() * 15 + 15 + "px";

            document.body.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, 5000);
        }

        // Bấm vào trái tim lớn sẽ bắn ra tim nhỏ
        function createBurst() {
            for (let i = 0; i < 15; i++) {
                createHeart();
            }
        }

        // Bắt đầu chạy khi tải trang
        window.onload = () => {
            typeWriter();
            setInterval(createHeart, 300);
        };
    </script>
</body>
</html>
