<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dành Cho Cậu ❤️</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            position: relative;
        }

        #heartCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .container {
            position: relative;
            z-index: 2;
            width: 90%;
            max-width: 420px;
            text-align: center;
            padding: 20px;
        }

        .card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 24px;
            padding: 30px 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        }

        .img-box {
            width: 110px;
            height: 110px;
            margin: 0 auto 20px;
            border-radius: 50%;
            overflow: hidden;
            border: 3px solid #ff6699;
            box-shadow: 0 0 25px rgba(255, 102, 153, 0.6);
        }
        .img-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        h2 {
            color: #ff85a2;
            font-size: 1.5rem;
            margin-bottom: 15px;
        }

        .message-box {
            font-size: 1.05rem;
            line-height: 1.6;
            color: #f1f1f1;
            min-height: 90px;
            margin-bottom: 20px;
            text-align: left;
            background: rgba(0, 0, 0, 0.25);
            padding: 15px;
            border-radius: 14px;
        }

        .btn-group {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            position: relative;
            margin-top: 10px;
        }

        button {
            padding: 12px 26px;
            font-size: 1rem;
            font-weight: 600;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-yes {
            background: linear-gradient(45deg, #ff4b2b, #ff416c);
            color: white;
            box-shadow: 0 5px 20px rgba(255, 65, 108, 0.5);
        }
        .btn-yes:hover {
            transform: scale(1.08);
        }

        .btn-no {
            background: rgba(255, 255, 255, 0.2);
            color: #eee;
            transition: transform 0.2s ease;
        }

        /* ALBUM SCREEN */
        #album-screen {
            display: none;
        }

        .photo-frame {
            width: 100%;
            height: 240px;
            border-radius: 16px;
            overflow: hidden;
            border: 2px solid rgba(255, 255, 255, 0.3);
            margin-bottom: 15px;
        }
        .photo-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .photo-caption {
            font-size: 1rem;
            color: #ffb3c6;
            margin-bottom: 20px;
            min-height: 45px;
        }

        .nav-btn {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            padding: 10px 18px;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <canvas id="heartCanvas"></canvas>

    <div class="container">
        <!-- MÀN HÌNH TỎ TÌNH -->
        <div class="card" id="proposal-screen">
            <div class="img-box">
                <img src="https://images.unsplash.com/photo-1518199266791-5375a83190b7?auto=format&fit=crop&w=300&q=80" alt="Avatar">
            </div>

            <h2>Gửi cậu, người tớ thương ❤️</h2>
            <div class="message-box" id="typing-text">Tớ không giỏi nói lời hoa mỹ, gửi gắm vào trang web này... Đồng ý làm một nửa của tớ nhé?</div>

            <div class="btn-group">
                <button class="btn-yes" onclick="acceptLove()">Đồng ý luôn 🥰</button>
                <button class="btn-no" id="btnNo" onmouseover="dodge()">Không 😜</button>
            </div>
        </div>

        <!-- MÀN HÌNH ALBUM -->
        <div class="card" id="album-screen">
            <h2>Khoảnh Khắc Đẹp Của Chúng Mình ✨</h2>
            
            <div class="photo-frame">
                <img id="current-photo" src="" alt="Kỷ niệm">
            </div>
            
            <div class="photo-caption" id="current-caption"></div>

            <div class="btn-group">
                <button class="nav-btn" onclick="prevPhoto()">◀ Ảnh Trước</button>
                <button class="nav-btn" onclick="nextPhoto()">Ảnh Sau ▶</button>
            </div>
        </div>
    </div>

    <script>
        function dodge() {
            const btnNo = document.getElementById('btnNo');
            const randomX = (Math.random() - 0.5) * 160;
            const randomY = (Math.random() - 0.5) * 160;
            btnNo.style.transform = `translate(${randomX}px, ${randomY}px)`;
        }

        const gallery = [
            {
                url: "https://images.unsplash.com/photo-1516589178581-6cd7833ae3b2?auto=format&fit=crop&w=600&q=80",
                caption: "Lần đầu tiên tụi mình cùng đi chơi nè! ❤️"
            },
            {
                url: "https://images.unsplash.com/photo-1522673607200-164d1b6ce486?auto=format&fit=crop&w=600&q=80",
                caption: "Khoảnh khắc bình yên nhất là khi bên cậu ✨"
            },
            {
                url: "https://images.unsplash.com/photo-1529156069898-49953e39b3ac?auto=format&fit=crop&w=600&q=80",
                caption: "Cảm ơn cậu vì đã luôn đồng hành cùng tớ!"
            }
        ];

        let currentPhotoIndex = 0;

        function showPhoto(idx) {
            document.getElementById('current-photo').src = gallery[idx].url;
            document.getElementById('current-caption').innerText = gallery[idx].caption;
        }

        function prevPhoto() {
            currentPhotoIndex = (currentPhotoIndex - 1 + gallery.length) % gallery.length;
            showPhoto(currentPhotoIndex);
        }

        function nextPhoto() {
            currentPhotoIndex = (currentPhotoIndex + 1) % gallery.length;
            showPhoto(currentPhotoIndex);
        }

        function acceptLove() {
            document.getElementById('proposal-screen').style.display = 'none';
            document.getElementById('album-screen').style.display = 'block';
            showPhoto(0);
        }

        // Hiệu ứng mưa tim rơi
        const canvas = document.getElementById('heartCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let hearts = [];
        for (let i = 0; i < 30; i++) {
            hearts.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                size: Math.random() * 6 + 3,
                speedY: Math.random() * 1.5 + 0.5
            });
        }

        function drawHearts() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = 'rgba(255, 105, 180, 0.6)';
            hearts.forEach(h => {
                ctx.beginPath();
                ctx.arc(h.x, h.y, h.size, 0, Math.PI * 2);
                ctx.fill();
                h.y += h.speedY;
                if (h.y > canvas.height) h.y = -10;
            });
            requestAnimationFrame(drawHearts);
        }
        drawHearts();
    </script>
</body>
</html>
