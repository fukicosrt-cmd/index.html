<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dành Cho Cậu ❤️</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            position: relative;
        }

        /* Canvas hiệu ứng tim rơi & pháo hoa */
        #heartCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .container {
            position: relative;
            z-index: 2;
            width: 90%;
            max-width: 420px;
            text-align: center;
            padding: 20px;
        }

        /* Thẻ chính */
        .card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 24px;
            padding: 30px 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            animation: fadeIn 1s ease-in-out;
        }

        /* Khung ảnh đại diện ban đầu */
        .img-box {
            width: 110px;
            height: 110px;
            margin: 0 auto 20px;
            border-radius: 50%;
            overflow: hidden;
            border: 3px solid #ff6699;
            box-shadow: 0 0 25px rgba(255, 102, 153, 0.6);
            animation: pulse 2s infinite ease-in-out;
        }
        .img-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        h2 {
            color: #ff85a2;
            font-size: 1.5rem;
            margin-bottom: 15px;
        }

        .message-box {
            font-size: 1.05rem;
            line-height: 1.6;
            color: #f1f1f1;
            min-height: 90px;
            margin-bottom: 20px;
            text-align: left;
            background: rgba(0, 0, 0, 0.25);
            padding: 15px;
            border-radius: 14px;
        }

        /* Nút bấm */
        .btn-group {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            position: relative;
            margin-top: 10px;
        }

        button {
            padding: 12px 26px;
            font-size: 1rem;
            font-weight: 600;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-yes {
            background: linear-gradient(45deg, #ff4b2b, #ff416c);
            color: white;
            box-shadow: 0 5px 20px rgba(255, 65, 108, 0.5);
        }
        .btn-yes:hover {
            transform: scale(1.08);
            box-shadow: 0 8px 25px rgba(255, 65, 108, 0.8);
        }

        .btn-no {
            background: rgba(255, 255, 255, 0.2);
            color: #eee;
            backdrop-filter: blur(5px);
        }

        /* GIAO DIỆN ALBUM KỶ NIỆM (Ẩn ban đầu) */
        #album-screen {
            display: none;
            animation: zoomIn 0.8s ease-in-out forwards;
        }

        .album-card {
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 24px;
            padding: 25px 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
        }

        .photo-frame {
            width: 100%;
            height: 250px;
            border-radius: 16px;
            overflow: hidden;
            border: 2px solid rgba(255, 255, 255, 0.3);
            margin-bottom: 15px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
        }
        .photo-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: 0.5s ease;
        }

        .photo-caption {
            font-size: 1.05rem;
            color: #ffb3c6;
            margin-bottom: 20px;
            font-weight: 500;
            min-height: 48px;
        }

        .nav-btn {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            padding: 10px 20px;
            font-size: 0.9rem;
        }
        .nav-btn:hover {
            background: #ff416c;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes zoomIn {
            from { opacity: 0; transform: scale(0.8); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>

    <canvas id="heartCanvas"></canvas>

    <div class="container">
        <!-- MÀN HÌNH TỎ TÌNH -->
        <div class="card" id="proposal-screen">
            <div class="img-box">
                <img src="https://images.unsplash.com/photo-1518199266791-5375a83190b7?auto=format&fit=crop&w=300&q=80" alt="Avatar">
            </div>

            <h2>Gửi cậu, người tớ thương ❤️</h2>
            <div class="message-box" id="typing-text"></div>

            <div class="btn-group">
                <button class="btn-yes" onclick="acceptLove()">Đồng ý luôn 🥰</button>
                <button class="btn-no" id="btnNo" onmouseover="dodge()">Không
