<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gửi Cậu ✨</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #0b0c10;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            text-align: center;
        }

        /* Màn hình chờ mở thư */
        #intro-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            cursor: pointer;
        }

        .envelope {
            font-size: 80px;
            animation: bounce 1.5s infinite ease-in-out;
            filter: drop-shadow(0 0 15px rgba(255, 105, 180, 0.6));
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        .btn-open {
            background: linear-gradient(135deg, #ff416c, #ff4b2b);
            color: white;
            font-size: 1.1rem;
            font-weight: bold;
            padding: 14px 30px;
            border: none;
            border-radius: 30px;
            box-shadow: 0 5px 20px rgba(255, 65, 108, 0.5);
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-open:hover {
            transform: scale(1.08);
            box-shadow: 0 8px 25px rgba(255, 65, 108, 0.8);
        }

        /* Màn hình nội dung chính (Ẩn lúc đầu) */
        #main-screen {
            display: none;
            flex-direction: column;
            align-items: center;
            animation: fadeIn 1s forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        /* Trái tim 3D lấp lánh */
        .heart-box {
            position: relative;
            width: 80px;
            height: 80px;
            margin-bottom: 25px;
            animation: beat 1.2s infinite ease-in-out;
        }
        .heart {
            background-color: #ff3366;
            display: inline-block;
            height: 50px;
            position: relative;
            transform: rotate(-45deg);
            width: 50px;
            box-shadow: 0 0 35px #ff3366;
        }
        .heart:before, .heart:after {
            content: "";
            background-color: #ff3366;
            border-radius: 50%;
            height: 50px;
            position: absolute;
            width: 50px;
        }
        .heart:before { top: -25px; left: 0; }
        .heart:after { left: 25px; top: 0; }

        @keyframes beat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }

        /* Khung chứa nội dung */
        .card {
            background: rgba(255, 255, 255, 0.05);
            padding: 30px 25px;
            border-radius: 20px;
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            max-width: 380px;
            width: 90vw;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
        }

        h2 {
            color: #ff6699;
            margin-bottom: 15px;
            font-size: 1.5rem;
        }

        #typing-text {
            font-size: 1.1rem;
            line-height: 1.6;
            color: #eaeaea;
            min-height: 80px;
            margin-bottom: 25px;
        }

        /* Nút lựa chọn */
        .btn-group {
            display: flex;
            justify-content: center;
            gap: 20px;
            position: relative;
            height: 50px;
        }

        button.choice {
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: bold;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-yes {
            background: linear-gradient(45deg, #ff3366, #ff6699);
            color: white;
            box-shadow: 0 5px 15px rgba(255, 51, 102, 0.4);
        }

        .btn-no {
            background: #444;
            color: white;
            position: absolute;
            right: 30px;
        }
    </style>
</head>
<body>

    <!-- Màn hình dẫn dắt ban đầu -->
    <div id="intro-screen">
        <div class="envelope">💌</div>
        <button class="btn-open" onclick="openLetter()">Mở thư dành riêng cho cậu ✨</button>
    </div>

    <!-- Màn hình chính tỏ tình -->
    <div id="main-screen">
        <div class="heart-box">
            <div class="heart"></div>
        </div>

        <div class="card">
            <h2>Gửi cậu... ❤️</h2>
            <div id="typing-text"></div>

            <div class="btn-group">
                <button class="choice btn-yes" onclick="agree()">Đồng ý luôn 🥰</button>
                <button class="choice btn-no" id="btnNo" onmouseover="dodge()">Không nha 😜</button>
            </div>
        </div>
    </div>

    <!-- Link nhạc nền (Bro có thể đổi link nhạc tùy thích) -->
    <audio id="bgMusic" loop preload="auto">
        <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mp3">
    </audio>

    <script>
        const message = "Tớ dành chút thời gian làm trang web nhỏ này gửi riêng cho cậu. Cậu có đồng ý làm một nửa của tớ không? 😉";
        let index = 0;
        const speed = 65;

        // Hàm khi người dùng bấm mở thư
        function openLetter() {
            // 1. Phục hồi & Phát nhạc nền ngay lập tức
            const music = document.getElementById('bgMusic');
            music.play().catch(e => console.log("Lỗi nhạc:", e));

            // 2. Chuyển màn hình
            document.getElementById('intro-screen').style.display = 'none';
            document.getElementById('main-screen').style.display = 'flex';

            // 3. Chạy chữ gõ từ từ
            typeWriter();
        }

        function typeWriter() {
            if (index < message.length) {
                document.getElementById("typing-text").innerHTML += message.charAt(index);
                index++;
                setTimeout(typeWriter, speed);
            }
        }

        // Nút "Không" né khi chạm vào
        function dodge() {
            const btnNo = document.getElementById('btnNo');
            const x = Math.random() * (window.innerWidth - 120) - (window.innerWidth / 2 - 80);
            const y = Math.random() * (window.innerHeight - 100) - (window.innerHeight / 2 - 40);
            btnNo.style.transform = `translate(${x}px, ${y}px)`;
        }

        // Khi đồng ý
        function agree() {
            alert("Cảm ơn cậu nha! Tớ biết thế nào cậu cũng chọn nút này mà ❤️🥰");
        }
    </script>
</body>
</html>
