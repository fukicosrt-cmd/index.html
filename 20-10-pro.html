<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Qua 20/10 Dac Biet</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: radial-gradient(circle at center, #361f38 0%, #100814 100%);
            color: #ffffff;
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            padding: 20px 0;
        }

        #welcome-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(13, 6, 18, 0.95);
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }

        .btn-start {
            background: linear-gradient(135deg, #ff758c, #ff7eb3);
            color: #ffffff;
            border: none;
            padding: 15px 35px;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(255, 117, 140, 0.6);
            transition: 0.3s;
            margin-top: 20px;
        }
        .btn-start:hover {
            transform: scale(1.1);
        }

        .main-container {
            display: flex;
            flex-wrap: wrap;
            gap: 25px;
            justify-content: center;
            align-items: center;
            max-width: 950px;
            width: 100%;
            z-index: 2;
        }

        /* Khung thiệp bên trái */
        .card-box {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 25px;
            width: 380px;
            height: 500px;
            padding: 25px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.7);
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .card-header {
            text-align: center;
            font-size: 1.3rem;
            color: #ff9a9e;
            font-weight: 700;
            margin-bottom: 12px;
            border-bottom: 1px dashed rgba(255, 255, 255, 0.2);
            padding-bottom: 8px;
        }

        .wish-scroll {
            flex: 1;
            overflow-y: auto;
            font-size: 0.88rem;
            line-height: 1.6;
            color: #ffffff;
            padding-right: 5px;
        }
        .wish-scroll::-webkit-scrollbar {
            width: 4px;
        }
        .wish-scroll::-webkit-scrollbar-thumb {
            background: rgba(255, 117, 140, 0.5);
            border-radius: 10px;
        }

        /* Khung canvas bên phải y hệt mẫu */
        .canvas-box {
            background: #ffffff;
            border-radius: 25px;
            width: 400px;
            height: 500px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.7);
            overflow: hidden;
        }

        canvas {
            display: block;
            background: #ffffff;
        }

        /* Khung ảnh slideshow góc phải dưới */
        .slideshow-container {
            position: absolute;
            bottom: 15px;
            right: 15px;
            width: 120px;
            height: 140px;
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid #ff758c;
            box-shadow: 0 8px 15px rgba(0,0,0,0.3);
            background: #fff;
            cursor: pointer;
            transition: transform 0.3s;
        }
        .slideshow-container:hover {
            transform: scale(1.05);
        }
        .slideshow-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            opacity: 0;
            transition: opacity 1s ease-in-out;
        }
        .slideshow-container img.active {
            opacity: 1;
        }

        /* Modal phóng to ảnh */
        #imageModal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 50;
            display: none;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        #imageModal img {
            max-width: 90%;
            max-height: 90%;
            border-radius: 15px;
            border: 3px solid #ff758c;
        }

        @media (max-width: 850px) {
            .main-container {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>

    <div id="welcome-overlay">
        <div style="font-size: 80px; margin-bottom: 15px; animation: bounce 2s infinite;">🎁</div>
        <h1 style="color: #ff9a9e; font-size: 1.8rem; margin-bottom: 10px;">Mon Qua 20/10 Dac Biet</h1>
        <p style="color: #ffb3c6; margin-bottom: 20px;">Nhan nut ben duoi de mo qua va trai nghiem nhe!</p>
        <button class="btn-start" onclick="startExperience()">Mo Qua Ngay</button>
    </div>

    <div id="imageModal" onclick="this.style.display='none'">
        <img id="modalImg" src="" alt="Zoomed">
    </div>

    <div class="main-container">
        <!-- BÊN TRÁI: THƯ GỬI -->
        <div class="card-box">
            <div class="card-header">Goi Cau...</div>
            <div class="wish-scroll" id="typing-text"></div>
        </div>

        <!-- BÊN PHẢI: CÂY TRÁI TIM NỞ RỘ Y HỆT MẪU -->
        <div class="canvas-box">
            <canvas id="treeCanvas" width="400" height="500"></canvas>
            
            <div class="slideshow-container" onclick="document.getElementById('imageModal').style.display='flex'; document.getElementById('modalImg').src=this.querySelector('.active').src;">
                <img src="https://images.unsplash.com/photo-1518199266791-5375a83190b7?auto=format&fit=crop&w=400&q=80" class="active" alt="Memory 1">
                <img src="https://images.unsplash.com/photo-1526047932273-341f2a7631f9?auto=format&fit=crop&w=400&q=80" alt="Memory 2">
                <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=400&q=80" alt="Memory 3">
            </div>
        </div>
    </div>

    <audio id="bgMusic" loop preload="auto">
        <source src="https://files.catbox.moe/q2y29g.mp3" type="audio/mp3">
    </audio>

    <script>
        function startExperience() {
            const overlay = document.getElementById('welcome-overlay');
            overlay.style.opacity = '0';
            setTimeout(() => overlay.style.display = 'none', 600);

            const music = document.getElementById('bgMusic');
            if (music) music.play().catch(() => {});

            startTyping();
            runExactTreeAnimation();
        }

        const text = "Chúc mừng ngày 20/10 người bạn tuyệt vời của tớ! \n\nCảm ơn cậu vì đã luôn xuất hiện với nguồn năng lượng tích cực, luôn xinh đẹp, rạng rỡ và mang lại nhiều niềm vui cho những người xung quanh. \n\nChúc cậu hôm nay và 364 ngày còn lại trong năm luôn ngập tràn hạnh phúc, đạt được mọi dự định và luôn mỉm cười thật tươi nhé! Món quà nhỏ này thay cho lời chúc chân thành nhất gửi đến cậu.";
        
        function startTyping() {
            let i = 0;
            const target = document.getElementById("typing-text");
            function typeStep() {
                if (i < text.length && target) {
                    if (text.charAt(i) === '\n') {
                        target.innerHTML += '<br>';
                    } else {
                        target.innerHTML += text.charAt(i);
                    }
                    i++;
                    target.scrollTop = target.scrollHeight;
                    setTimeout(typeStep, 35);
                }
            }
            typeStep();
        }

        let currentSlide = 0;
        const slides = document.querySelectorAll('.slideshow-container img');
        setInterval(() => {
            if(slides.length === 0) return;
            slides[currentSlide].classList.remove('active');
            currentSlide = (currentSlide + 1) % slides.length;
            slides[currentSlide].classList.add('active');
        }, 3000);

        // Hiệu ứng chuẩn xác y hệt video mẫu (Hạt mọc -> Vươn thân -> Bung tán lá trái tim nhiều màu)
        function runExactTreeAnimation() {
            const canvas = document.getElementById('treeCanvas');
            const ctx = canvas.getContext('2d');

            let progress = 0;
            let heartLeaves = [];

            for(let i = 0; i < 150; i++) {
                let t = Math.random() * Math.PI * 2;
                let x = 16 * Math.pow(Math.sin(t), 3);
                let y = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));
                heartLeaves.push({
                    x: 200 + x * 10,
                    y: 180 + y * 10,
                    size: Math.random() * 6 + 4,
                    color: `hsl(${Math.random() * 50 + 325}, 100%, ${Math.random() * 25 + 60}%)`
                });
            }

            function drawHeart(x, y, size, color) {
                ctx.fillStyle = color;
                ctx.beginPath();
                let d = size;
                ctx.moveTo(x, y + d / 4);
                ctx.quadraticCurveTo(x, y, x + d / 4, y);
                ctx.quadraticCurveTo(x + d / 2, y, x + d / 2, y + d / 4);
                ctx.quadraticCurveTo(x + d / 2, y, x + 3 * d / 4, y);
                ctx.quadraticCurveTo(x + d, y, x + d, y + d / 4);
                ctx.quadraticCurveTo(x + d, y + d / 2, x + 3 * d / 4, y + 3 * d / 4);
                ctx.lineTo(x + d / 2, y + d);
                ctx.lineTo(x + d / 4, y + 3 * d / 4);
                ctx.quadraticCurveTo(x, y + d / 2, x, y + d / 4);
                ctx.fill();
            }

            function animate() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                // Giai đoạn 1: Hạt giống
                if (progress < 15) {
                    ctx.fillStyle = '#ff758c';
                    ctx.beginPath();
                    ctx.arc(200, 480 - progress * 2, 4, 0, Math.PI * 2);
                    ctx.fill();
                }

                // Giai đoạn 2: Vươn thân cây
                if (progress >= 15) {
                    let trunkH = Math.min(220, (progress - 15) * 3.5);
                    ctx.strokeStyle = '#5c3a21';
                    ctx.lineWidth = 8;
                    ctx.lineCap = 'round';
                    ctx.beginPath();
                    ctx.moveTo(200, 500);
                    ctx.quadraticCurveTo(200, 500 - trunkH/2, 200, 500 - trunkH);
                    ctx.stroke();

                    // Nhành cây
                    if (progress > 45) {
                        ctx.lineWidth = 4;
                        ctx.beginPath();
                        ctx.moveTo(200, 400);
                        ctx.quadraticCurveTo(140, 350, 115, 290);
                        ctx.moveTo(200, 370);
                        ctx.quadraticCurveTo(260, 340, 285, 270);
                        ctx.stroke();
                    }
                }

                // Giai đoạn 3: Nở hoa trái tim
                if (progress > 55) {
                    let count = Math.floor(((progress - 55) / 45) * heartLeaves.length);
                    for (let i = 0; i < count && i < heartLeaves.length; i++) {
                        let h = heartLeaves[i];
                        drawHeart(h.x, h.y, h.size, h.color);
                    }
                }

                if (progress < 100) {
                    progress += 0.8;
                    requestAnimationFrame(animate);
                } else {
                    requestAnimationFrame(animate);
                }
            }
            animate();
        }
    </script>
</body>
</html>
