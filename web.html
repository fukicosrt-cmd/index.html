<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xin Lỗi Mà, Đừng Giận Nữa Nhe 🥺❤️</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: radial-gradient(circle at center, #2d1f3d 0%, #0f0a17 100%);
            color: #fff;
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        #fireworksCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .scene {
            position: relative;
            z-index: 2;
            width: 90%;
            max-width: 440px;
        }

        .card-3d {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 30px;
            padding: 35px 25px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.7);
            text-align: center;
        }

        #forgive-screen {
            display: none;
            animation: fadeIn 0.8s ease forwards;
        }

        .gift-box {
            font-size: 80px;
            cursor: pointer;
            margin-bottom: 15px;
            display: inline-block;
            animation: bounce 2s infinite ease-in-out;
            filter: drop-shadow(0 10px 15px rgba(255, 182, 193, 0.5));
            transition: 0.3s;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        h1 {
            font-size: 1.7rem;
            background: linear-gradient(45deg, #ff9a9e, #fecfef, #fe9a8b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 15px;
            font-weight: 700;
        }

        .wish-message {
            font-size: 0.98rem;
            line-height: 1.7;
            color: #f1f1f1;
            background: rgba(0, 0, 0, 0.35);
            padding: 18px;
            border-radius: 16px;
            margin-bottom: 22px;
            border-left: 4px solid #ff9a9e;
            text-align: left;
            min-height: 100px;
        }

        .btn-group {
            display: flex;
            gap: 12px;
            justify-content: center;
            align-items: center;
            margin-top: 15px;
        }

        .btn-love {
            background: linear-gradient(135deg, #ff758c, #ff7eb3);
            color: white;
            border: none;
            padding: 13px 25px;
            font-size: 0.95rem;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(255, 117, 140, 0.5);
            transition: 0.3s;
        }
        .btn-love:hover {
            transform: scale(1.08);
            box-shadow: 0 15px 25px rgba(255, 117, 140, 0.8);
        }

        .btn-sad {
            background: rgba(255, 255, 255, 0.15);
            color: #ddd;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 13px 20px;
            font-size: 0.9rem;
            font-weight: 500;
            border-radius: 50px;
            cursor: pointer;
            transition: 0.3s;
        }

        .photo-container {
            width: 100%;
            height: 220px;
            border-radius: 18px;
            overflow: hidden;
            margin-bottom: 18px;
            border: 2px solid rgba(255,255,255,0.25);
        }
        .photo-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>

    <canvas id="fireworksCanvas"></canvas>

    <div class="scene">
        <!-- MÀN HÌNH CHÍNH XIN LỖI -->
        <div class="card-3d" id="main-screen">
            <div class="gift-box" onclick="openApology()">🥺🎁</div>
            <h1>Có Người Muốn Xin Lỗi... 🥺</h1>
            
            <div class="wish-message" id="typing-text"></div>

            <p style="font-size: 0.9rem; color: #ffb3c6; margin-bottom: 12px;">Thế cậu đã hết giận tớ chưa?</p>

            <div class="btn-group">
                <button class="btn-love" onclick="openApology()">Hết Giận Rồi ❤️</button>
                <button class="btn-sad" id="btnSad" onclick="stillAngry()">Vẫn Giận! 😤</button>
            </div>
        </div>

        <!-- MÀN HÌNH CẢM ƠN KHI ĐƯỢC THA LỖI -->
        <div class="card-3d" id="forgive-screen">
            <h1>Yêu Cậu Nhất Luôn! 🥰✨</h1>
            <div class="photo-container">
                <img src="https://images.unsplash.com/photo-1518199266791-5375a83190b7?auto=format&fit=crop&w=600&q=80" alt="Cute Apology">
            </div>
            <p style="color: #ffb3c6; margin-bottom: 20px; font-weight: 500; line-height: 1.6;">
                Cảm ơn cậu vì đã tha lỗi cho tớ nha! Tớ hứa lần sau sẽ không làm cậu buồn nữa đâu. Ngoan ngoan nhé! 🌸🧸
            </p>
            <button class="btn-love" onclick="location.reload()">Gửi Lại Yêu Thương 💖</button>
        </div>
    </div>

    <!-- Nhạc Lofi nhẹ nhàng êm dịu -->
    <audio id="bgMusic" loop preload="auto">
        <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3" type="audio/mp3">
    </audio>

    <script>
        const text = "Tớ biết tớ sai rồi, làm cậu buồn làm tớ hối hận lắm luôn. Cho tớ xin lỗi nhé! Tớ không cố ý đâu, đừng giận tớ nữa mà... 🥺👉👈";
        
        window.addEventListener('DOMContentLoaded', () => {
            let i = 0;
            const target = document.getElementById("typing-text");
            
            function typing() {
                if (i < text.length && target) {
                    target.innerHTML += text.charAt(i);
                    i++;
                    setTimeout(typing, 35);
                }
            }
            typing();
        });

        // Bật nhạc khi bấm
        document.body.addEventListener('click', () => {
            const music = document.getElementById('bgMusic');
            if (music && music.paused) {
                music.play().catch(() => {});
            }
        }, { once: true });

        // Xử lý khi chọn "Vẫn giận"
        let angryCount = 0;
        const angryTexts = ["Thật luôn? 🥺", "Năn nỉ mà... 🙏", "Thương tớ đi 😭", "Hết giận nha ❤️"];
        function stillAngry() {
            const btn = document.getElementById('btnSad');
            if (btn) {
                btn.innerText = angryTexts[angryCount % angryTexts.length];
                angryCount++;
                const loveBtn = document.querySelector('.btn-love');
                if (loveBtn) {
                    loveBtn.style.transform = `scale(${1 + angryCount * 0.08})`;
                }
            }
        }

        // Mở màn hình đã tha lỗi
        function openApology() {
            const mainScreen = document.getElementById('main-screen');
            const forgiveScreen = document.getElementById('forgive-screen');
            if (mainScreen && forgiveScreen) {
                mainScreen.style.display = 'none';
                forgiveScreen.style.display = 'block';
                triggerFireworks();
            }
        }

        // Hiệu ứng hạt hồng lấp lánh
        const canvas = document.getElementById('fireworksCanvas');
        const ctx = canvas ? canvas.getContext('2d') : null;
        if (canvas) {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        let particles = [];

        function triggerFireworks() {
            if (!canvas) return;
            for (let i = 0; i < 80; i++) {
                particles.push({
                    x: canvas.width / 2,
                    y: canvas.height / 2,
                    vx: (Math.random() - 0.5) * 10,
                    vy: (Math.random() - 0.5) * 10,
                    color: `hsl(${Math.random() * 50 + 330}, 100%, 75%)`,
                    alpha: 1,
                    size: Math.random() * 5 + 2
                });
            }
        }

        function animate() {
            if (ctx && canvas) {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                particles.forEach((p, index) => {
                    p.x += p.vx;
                    p.y += p.vy;
                    p.vy += 0.08;
                    p.alpha -= 0.012;

                    if (p.alpha <= 0) {
                        particles.splice(index, 1);
                    } else {
                        ctx.save();
                        ctx.globalAlpha = p.alpha;
                        ctx.fillStyle = p.color;
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.restore();
                    }
                });
            }
            requestAnimationFrame(animate);
        }
        animate();

        window.addEventListener('resize', () => {
            if (canvas) {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }
        });
    </script>
</body>
</html>
