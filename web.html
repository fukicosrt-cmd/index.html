<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dành Cho Người Yêu Cũ 🎁✨</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: radial-gradient(circle at center, #2b1e3a 0%, #0c0814 100%);
            color: #fff;
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            perspective: 1000px;
        }

        .scene {
            position: relative;
            z-index: 2;
            width: 90%;
            max-width: 440px;
        }

        .card-3d {
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 28px;
            padding: 35px 25px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.7);
            text-align: center;
        }

        #letter-section {
            display: none;
            animation: fadeIn 0.8s ease forwards;
        }

        .gift-box {
            font-size: 80px;
            cursor: pointer;
            margin-bottom: 15px;
            display: inline-block;
            animation: floatGift 2.5s infinite ease-in-out;
            filter: drop-shadow(0 10px 15px rgba(186, 104, 200, 0.4));
            transition: 0.3s;
        }
        .gift-box:hover {
            transform: scale(1.12) rotate(-8deg);
        }

        @keyframes floatGift {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-12px); }
        }

        h1 {
            font-size: 1.7rem;
            background: linear-gradient(45deg, #ce93d8, #ab47bc, #f48fb1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 15px;
            font-weight: 700;
        }

        .wish-message {
            font-size: 0.98rem;
            line-height: 1.7;
            color: #e0e0e0;
            background: rgba(0, 0, 0, 0.35);
            padding: 18px;
            border-radius: 16px;
            margin-bottom: 22px;
            border-left: 4px solid #ab47bc;
            text-align: left;
            min-height: 110px;
        }

        .btn-custom {
            background: linear-gradient(135deg, #8e24aa, #d81b60);
            color: white;
            border: none;
            padding: 13px 28px;
            font-size: 0.95rem;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 10px 22px rgba(142, 36, 170, 0.5);
            transition: 0.3s;
        }
        .btn-custom:hover {
            transform: translateY(-3px);
            box-shadow: 0 14px 28px rgba(142, 36, 170, 0.8);
        }

        .photo-container {
            width: 100%;
            height: 220px;
            border-radius: 16px;
            overflow: hidden;
            margin-bottom: 18px;
            border: 2px solid rgba(255,255,255,0.2);
        }
        .photo-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="scene">
        <!-- MÀN HÌNH MỞ QUÀ BAN ĐẦU -->
        <div class="card-3d" id="main-screen">
            <div class="gift-box" onclick="openGift()">🎁</div>
            <h1>Có Một Món Quà Nhỏ... 🖤</h1>
            <p style="color: #b0bec5; font-size: 0.9rem; margin-bottom: 20px;">Gửi người từng là tất cả. Chạm vào hộp quà để xem nhé!</p>

            <button class="btn-custom" onclick="openGift()">Mở Quà Ngay ✨</button>
        </div>

        <!-- MÀN HÌNH THƯ VÀ LỜI NHẮN -->
        <div class="card-3d" id="letter-section">
            <h1>Gửi Người Yêu Cũ 🥀</h1>
            
            <div class="photo-container">
                <!-- Thay ảnh kỷ niệm hoặc ảnh troll vào đây -->
                <img src="https://images.unsplash.com/photo-1518199266791-5375a83190b7?auto=format&fit=crop&w=600&q=80" alt="Memory">
            </div>

            <div class="wish-message" id="typing-text"></div>

            <button class="btn-custom" onclick="location.reload()">Đóng Lại 🔄</button>
        </div>
    </div>

    <!-- Nhạc Lofi buồn chill nhẹ -->
    <audio id="bgMusic" loop preload="auto">
        <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3" type="audio/mp3">
    </audio>

    <script>
        // Lời nhắn cho người yêu cũ (Bro sửa lại nội dung theo ý thích nhé)
        const text = "Cảm ơn vì đã từng là một phần thanh xuân của tớ. Dù bây giờ chúng ta đi hai đường khác nhau, mong cậu luôn hạnh phúc, bình an và sống thật tốt nhé! Cảm ơn và tạm biệt... 🖤✨";
        let i = 0;

        function typing() {
            if (i < text.length) {
                document.getElementById("typing-text").innerHTML += text.charAt(i);
                i++;
                setTimeout(typing, 40);
            }
        }

        function openGift() {
            // Phát nhạc
            const music = document.getElementById('bgMusic');
            music.play().catch(() => {});

            // Chuyển màn hình
            document.getElementById('main-screen').style.display = 'none';
            document.getElementById('letter-section').style.display = 'block';

            // Gõ chữ
            typing();
        }
    </script>
</body>
</html>
